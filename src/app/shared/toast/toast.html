@if (messages().length > 0) {
  <ul class="toasts" role="list">
    @for (m of messages(); track m.id) {
      <li
        class="toast"
        [class.toast--info]="m.level === 'info'"
        [class.toast--warning]="m.level === 'warning'"
        [class.toast--error]="m.level === 'error'"
        role="status"
      >
        <span class="toast__icon" aria-hidden="true">
          @if (m.level === 'info') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 16v-4M12 8h.01"/>
            </svg>
          } @else if (m.level === 'warning') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
              <path d="M12 9v4M12 17h.01"/>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="m15 9-6 6M9 9l6 6"/>
            </svg>
          }
        </span>
        <span class="toast__text">{{ m.text }}</span>
        <button type="button" class="toast__close" (click)="dismiss(m.id)" aria-label="Dismiss notification">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </li>
    }
  </ul>
}
